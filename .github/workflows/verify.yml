name: Verify Oracle Ledger
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      database:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_RANDOM_PASSWORD: "yes"
          APP_USER: budget
          APP_USER_PASSWORD: ${{ github.run_id }}Demo
        ports:
          - 1521:1521
        options: --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
        env:
          BUDGET_TEST_EMPTY_SCHEMA: 'yes'
          BUDGET_DB_PASSWORD: ${{ github.run_id }}Demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/TEST-*.xml
