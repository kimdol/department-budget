name: Verify Oracle Ledger
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      database:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_RANDOM_PASSWORD: "yes"
          APP_USER: budget
          APP_USER_PASSWORD: ${{ github.run_id }}Demo
        ports:
          - 127.0.0.1:1521:1521
        options: --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
        working-directory: frontend
      - run: mvn -B -ntp verify
        env:
          BUDGET_TEST_EMPTY_SCHEMA: 'yes'
          BUDGET_DB_PASSWORD: ${{ github.run_id }}Demo
      - run: python3 ops/check_oracle_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-contract-results
          path: target/surefire-reports/kr.budget.claims.OraclePostingTest.txt
          if-no-files-found: error
      - name: Restore and reconcile Oracle ledger
        run: bash ops/ci_oracle_restore.sh
        env:
          ORACLE_SERVICE_CONTAINER: ${{ job.services.database.id }}
          BUDGET_DB_PASSWORD: ${{ github.run_id }}Demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-restore-comparison
          path: target/oracle-restore/
      - name: Install packaged WAR schema and exercise Oracle in Chrome
        run: bash ops/ci_oracle_release.sh
        env:
          ORACLE_SERVICE_CONTAINER: ${{ job.services.database.id }}
          BUDGET_DB_PASSWORD: ${{ github.run_id }}Demo
      - name: Measure deep inbox queries in Oracle
        run: python3 ops/measure_oracle_inbox.py
        env:
          ORACLE_SERVICE_CONTAINER: ${{ job.services.database.id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-inbox-plans
          path: target/oracle-inbox/
