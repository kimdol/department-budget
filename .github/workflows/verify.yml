name: Verify Oracle Ledger
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      database:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_RANDOM_PASSWORD: "yes"
          APP_USER: budget
          APP_USER_PASSWORD: ${{ github.run_id }}Demo
        ports:
          - 127.0.0.1:1521:1521
        options: --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: systemd-analyze verify ops/department-budget.service
      - run: npm ci && npm run build
        working-directory: frontend
      - run: mvn -B -ntp -f portal-importer/pom.xml verify
      - run: mvn -B -ntp verify
        env:
          BUDGET_TEST_EMPTY_SCHEMA: 'yes'
          BUDGET_DB_PASSWORD: ${{ github.run_id }}Demo
      - run: python3 ops/check_oracle_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-contract-results
          path: |
            target/surefire-reports/kr.budget.claims.OraclePostingTest.txt
            target/surefire-reports/oracle-cases.json
          if-no-files-found: error
      - name: Restore and reconcile Oracle ledger
        run: bash ops/ci_oracle_restore.sh
        env:
          ORACLE_SERVICE_CONTAINER: ${{ job.services.database.id }}
          BUDGET_DB_PASSWORD: ${{ github.run_id }}Demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-restore-comparison
          path: target/oracle-restore/
      - name: Install packaged WAR schema and exercise Oracle in Chrome
        run: bash ops/ci_oracle_release.sh
        env:
          ORACLE_SERVICE_CONTAINER: ${{ job.services.database.id }}
          BUDGET_DB_PASSWORD: ${{ github.run_id }}Demo
          RECORD_ROLLBACK_CLAIM: ${{ runner.temp }}/rollback-claim.txt
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-approval-contention
          path: target/approval-contention.json
          if-no-files-found: error
      - name: Roll back WAR and compare original claim postings
        run: bash ops/ci_war_rollback.sh
        env:
          ORACLE_SERVICE_CONTAINER: ${{ job.services.database.id }}
          BUDGET_DB_PASSWORD: ${{ github.run_id }}Demo
          RECORD_ROLLBACK_CLAIM: ${{ runner.temp }}/rollback-claim.txt
      - uses: actions/upload-artifact@v4
        with:
          name: war-rollback
          path: target/war-rollback/*.txt
          if-no-files-found: error
      - name: Upgrade a populated Oracle schema between WAR releases
        run: bash ops/ci_oracle_upgrade.sh
        env:
          ORACLE_SERVICE_CONTAINER: ${{ job.services.database.id }}
          BUDGET_DB_PASSWORD: ${{ github.run_id }}Demo
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-release-upgrade
          path: target/oracle-upgrade/result.txt
          if-no-files-found: error
      - name: Measure deep inbox queries in Oracle
        run: python3 ops/measure_oracle_inbox.py
        env:
          ORACLE_SERVICE_CONTAINER: ${{ job.services.database.id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-inbox-plans
          path: target/oracle-inbox/
      - name: Measure monthly settlement reports in Oracle
        run: |
          python3 ops/measure_oracle_month.py
          java -cp 'target/oracle-release/jdbc/*' ops/MeasureBudgetLock.java > target/oracle-month/budget-lock.csv
          python3 ops/measure_oracle_posting_writes.py
        env:
          ORACLE_SERVICE_CONTAINER: ${{ job.services.database.id }}
          BUDGET_DB_USER: budget_release
          BUDGET_DB_PASSWORD: ${{ github.run_id }}Demo
          BUDGET_DB_URL: jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-month-plans
          path: target/oracle-month/
      - name: Install PHP-FPM and MySQL driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php8.3-fpm php8.3-mysql libnss3-tools
      - name: Verify Caddy HTTPS with Oracle and MySQL in Chrome
        run: bash ops/ci_https_proxy.sh
        env:
          ORACLE_SERVICE_CONTAINER: ${{ job.services.database.id }}
          BUDGET_DB_PASSWORD: ${{ github.run_id }}Demo
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-transport
          path: |
            target/https-proxy/transport.json
            target/https-proxy/settlement-proof.json
            target/https-proxy/portal-replay.csv
            target/https-proxy/portal-listeners.txt
          if-no-files-found: error
      - name: Package tested WAR and Oracle installation SQL
        if: github.ref == 'refs/heads/main'
        run: |
          python3 ops/test_package_release.py
          python3 ops/package_release.py "$GITHUB_SHA" target/verified-release
          (cd target/verified-release && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: department-budget-release-${{ github.sha }}
          path: target/verified-release/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
