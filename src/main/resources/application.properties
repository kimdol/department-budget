spring.datasource.url=${BUDGET_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${BUDGET_DB_USER:budget}
spring.datasource.password=${BUDGET_DB_PASSWORD}
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.arg-name-based-constructor-auto-mapping=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${HTTPS_ONLY:true}
server.servlet.session.timeout=30m
server.error.include-message=never
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
