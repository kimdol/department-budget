[global]
error_log = syslog
syslog.ident = department-budget-portal

[portal]
listen = 127.0.0.1:18760
listen.allowed_clients = 127.0.0.1
pm = static
pm.max_children = 2
security.limit_extensions = .php
clear_env = yes
env[BUDGET_PORTAL_TOKEN] = $BUDGET_PORTAL_TOKEN
env[PORTAL_MYSQL_DSN] = $PORTAL_MYSQL_DSN
env[PORTAL_MYSQL_USER] = $PORTAL_MYSQL_USER
env[PORTAL_MYSQL_PASSWORD] = $PORTAL_MYSQL_PASSWORD
